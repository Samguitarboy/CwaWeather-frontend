<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新大陸天氣預報</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">

    <style>
        :root {
            --mh-parchment: #EAE0C8;
            --mh-dark-brown: #4A3F35;
            --mh-stone: #8A7B70;
            --mh-highlight: #C87D2D;
            --mh-border: #332E27;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Uncial Antiqua', cursive;
            background-color: var(--mh-parchment);
            /* Parchment texture background */
            background-image:
                radial-gradient(circle at 100% 150%, var(--mh-parchment) 24%, #fff 25%, #fff 28%, var(--mh-parchment) 29%, var(--mh-parchment) 36%, #fff 36%, #fff 40%, transparent 40%, transparent),
                radial-gradient(circle at 0 150%, var(--mh-parchment) 24%, #fff 25%, #fff 28%, var(--mh-parchment) 29%, var(--mh-parchment) 36%, #fff 36%, #fff 40%, transparent 40%, transparent),
                radial-gradient(circle at 50% 100%, #fff 10%, var(--mh-parchment) 11%, var(--mh-parchment) 23%, #fff 24%, #fff 30%, var(--mh-parchment) 31%, var(--mh-parchment) 43%, #fff 44%, #fff 50%, var(--mh-parchment) 51%, var(--mh-parchment) 63%, #fff 64%, #fff 71%, transparent 71%, transparent);
            background-size: 100px 50px;
            min-height: 100vh;
            color: var(--mh-dark-brown);
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* 頂部狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.1);
            border-bottom: 2px solid var(--mh-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .location-pill {
            background: var(--mh-highlight);
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid var(--mh-border);
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        .update-pill {
            font-size: 0.8rem;
            color: var(--mh-parchment);
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 5px;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* === 核心：今日焦點卡片 === */
        .hero-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 30px 25px;
            text-align: center;
            border: 3px solid var(--mh-border);
            margin-bottom: 25px;
            position: relative;
            box-shadow: 5px 5px 0px var(--mh-border);
        }

        .hero-period {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--mh-stone);
            color: white;
            padding: 5px 20px;
            border-radius: 5px;
            font-weight: bold;
            border: 2px solid var(--mh-border);
        }

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        .hero-icon {
            font-size: 5rem;
            filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.2));
        }

        .hero-temp {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--mh-dark-brown);
            line-height: 1;
        }

        .hero-desc {
            font-size: 1.5rem;
            color: var(--mh-dark-brown);
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* === 上班族最愛的：快速建議區 === */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed var(--mh-border);
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 10px;
        }

        .advice-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .advice-text {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--mh-dark-brown);
            margin: 5px 0;
            line-height: 1.2;
        }

        /* === 稍後預報：橫向滑動區 === */
        .section-title {
            font-size: 1.2rem;
            color: var(--mh-dark-brown);
            margin-bottom: 15px;
            margin-left: 10px;
            font-weight: 900;
            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.4);
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .mini-card {
            min-width: 140px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            padding: 20px 15px;
            text-align: center;
            border: 2px solid var(--mh-border);
            flex-shrink: 0;
        }

        .mini-time {
            background: var(--mh-highlight);
            color: white;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .mini-icon {
            font-size: 2.5rem;
            margin: 5px 0;
        }

        .mini-temp {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--mh-dark-brown);
        }

        /* Loading 畫面 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--mh-parchment);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen">
        <div style="font-size: 4rem;">🐉</div>
        <p style="color: var(--mh-dark-brown); font-weight: bold; margin-top: 20px;">正在觀察古龍的痕跡...</p>
    </div>
    <div class="status-bar">
        <div class="location-pill">📜 新大陸</div>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <div id="heroCard">
        </div>

        <h3 class="section-title">任務預報</h3>
        <div class="scroll-container" id="futureForecasts">
        </div>

    </div>

    <script>
        const API_URL = "https://weather-sam.zeabur.app/api/weather/kaohsiung";

        function getWeatherIcon(weather) {
            // MH-style icons would be better, using placeholders for now
            if (!weather) return "📜";
            if (weather.includes("晴")) return "☀️";
            if (weather.includes("多雲")) return "⛅";
            if (weather.includes("陰")) return "☁️";
            if (weather.includes("雨")) return "💧";
            if (weather.includes("雷")) return "⚡";
            return "📜";
        }

        function getAdvice(rainProb, maxTemp) {
            let rainIcon = "👍";
            let rainText = "適合狩獵";
            if (parseInt(rainProb) > 30) {
                rainIcon = "👎";
                rainText = "帶防水布";
            }

            let clothIcon = "👕";
            let clothText = "輕便裝束";
            if (parseInt(maxTemp) >= 28) {
                clothIcon = "🎽";
                clothText = "耐熱裝備";
            } else if (parseInt(maxTemp) <= 20) {
                clothIcon = "🧥";
                clothText = "耐寒裝備";
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "晨間";
            if (hour >= 11 && hour < 14) return "日間";
            if (hour >= 14 && hour < 18) return "黃昏";
            if (hour >= 18 && hour < 23) return "夜晚";
            return "深夜";
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            // 1. 渲染 Hero Card (主畫面)
            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById('heroCard').innerHTML = `
                        <div class="hero-card">
                            <div class="hero-period">${period}</div>
                            <div class="hero-temp-container">
                                <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                                <div class="hero-temp">${avgTemp}°</div>
                            </div>
                            <div class="hero-desc">${current.weather}</div>
                            
                            <div class="advice-grid">
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.rainIcon}</div>
                                    <div class="advice-text">${advice.rainText}</div>
                                    <div style="font-size:0.7rem; color:#999">降雨率 ${current.rain}</div>
                                </div>
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.clothIcon}</div>
                                    <div class="advice-text">${advice.clothText}</div>
                                    <div style="font-size:0.7rem; color:#999">最高溫 ${current.maxTemp}°</div>
                                </div>
                            </div>
                        </div>
                    `;

            // 2. 渲染稍後預報 (包含明天判斷)
            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);

                const fDate = new Date(f.startTime);
                if (fDate.getDate() !== todayDate) {
                    p = "明日" + p;
                }

                scrollContainer.innerHTML += `
                            <div class="mini-card">
                                <div class="mini-time">${p}</div>
                                <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                                <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                                <div style="font-size:0.8rem; color:#888; margin-top:5px;">💧${f.rain}</div>
                            </div>
                        `;
            });

            // 3. 右上角顯示今日日期
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

            document.getElementById('updateTime').textContent = `${month}月${date}日 ${days[dayIndex]}`;
        }

        async function fetchWeather() {
            try {
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));
                const fetchPromise = fetch(API_URL).then(res => res.json());
                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                if (json.success) {
                    renderWeather(json.data);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                console.error(e);
                alert("資料讀取失敗！接待員的網路被搔鳥拔走了！");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>

</html>
